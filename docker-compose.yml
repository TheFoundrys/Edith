name: edith

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: apps/web/.env
    environment:
      PORT: "3059"
      HOSTNAME: "0.0.0.0"
      AUTH_TRUST_HOST: "true"
    ports:
      - "3059:3059"
    volumes:
      - edith_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3059/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-p", "5439"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edith_dev
    ports:
      - "127.0.0.1:5439:5439"
    volumes:
      - edith_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5439 -U postgres -d edith_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  edith_pg:
  edith_uploads:
